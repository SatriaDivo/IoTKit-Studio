version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: iotkit-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: iotkit
      POSTGRES_PASSWORD: iotkit123
      POSTGRES_DB: iotkit_studio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iotkit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iotkit"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iotkit-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://iotkit:iotkit123@postgres:5432/iotkit_studio?schema=public
      - JWT_SECRET=your-super-secret-jwt-key-change-this
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iotkit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iotkit-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - iotkit-network

volumes:
  postgres_data:
    driver: local

networks:
  iotkit-network:
    driver: bridge
