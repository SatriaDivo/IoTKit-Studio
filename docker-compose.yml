services:
  postgres:
    image: postgres:15-alpine
    container_name: iotkit-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: iotkit
      POSTGRES_PASSWORD: iotkit123
      POSTGRES_DB: iotkit_studio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iotkit-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U iotkit" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Express Backend (Commented out - not started by default)
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: iotkit-backend
  #   restart: unless-stopped
  #   ports:
  #     - "4001:4000"
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=4000
  #     - DATABASE_URL=postgresql://iotkit:iotkit123@postgres:5432/iotkit_studio?schema=public
  #     - JWT_SECRET=your-super-secret-jwt-key-change-this
  #     - CORS_ORIGIN=http://localhost:3000
  #   volumes:
  #     - ./backend:/app
  #     - /app/node_modules
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - iotkit-network

  # Go Fiber Backend (Primary Active Backend - Exposed on 4000)

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: iotkit-backend-go
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_URL=host=postgres user=iotkit password=iotkit123 dbname=iotkit_studio port=5432 sslmode=disable
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - CORS_ORIGIN=http://localhost:3001
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=openai/gpt-oss-120b:free
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iotkit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4001
    container_name: iotkit-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4001
    depends_on:
      - backend-go
    networks:
      - iotkit-network

volumes:
  postgres_data:
    driver: local

networks:
  iotkit-network:
    driver: bridge
